<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32" shape-rendering="crispEdges" role="img" aria-label="BondLens voxel icon">
  <!--
    BondLens voxel mark
    Metaphor: lens over yield bars + bond strip (input → parse → score → report)
    Palette: deep teal field, mint voxels, amber highlight, cream text pixels
  -->
  <rect width="32" height="32" fill="#0b2f2b"/>

  <!-- soft vignette frame -->
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#134e48" stroke-width="1"/>
  <rect x="2" y="2" width="28" height="28" fill="#0f3d38"/>

  <!-- desk / board base -->
  <rect x="4" y="24" width="24" height="2" fill="#173f3a"/>
  <rect x="5" y="25" width="22" height="1" fill="#0a2421"/>

  <!-- yield bars (input signal) -->
  <rect x="5" y="18" width="2" height="6" fill="#1f6f66"/>
  <rect x="5" y="17" width="2" height="1" fill="#2a9a8d"/>
  <rect x="8" y="15" width="2" height="9" fill="#1f6f66"/>
  <rect x="8" y="14" width="2" height="1" fill="#2a9a8d"/>
  <rect x="11" y="12" width="2" height="12" fill="#1f6f66"/>
  <rect x="11" y="11" width="2" height="1" fill="#3bbfad"/>
  <rect x="14" y="16" width="2" height="8" fill="#1f6f66"/>
  <rect x="14" y="15" width="2" height="1" fill="#2a9a8d"/>

  <!-- bond strip / ticket (document body) -->
  <rect x="6" y="7" width="10" height="5" fill="#f4efe4"/>
  <rect x="6" y="7" width="10" height="1" fill="#c9b89a"/>
  <rect x="7" y="9" width="3" height="1" fill="#0f6b5f"/>
  <rect x="11" y="9" width="4" height="1" fill="#c07a22"/>
  <rect x="7" y="11" width="6" height="1" fill="#8a7a63"/>

  <!-- voxel lens rim -->
  <rect x="16" y="8" width="10" height="10" fill="none"/>
  <rect x="18" y="8" width="6" height="1" fill="#d9a24a"/>
  <rect x="17" y="9" width="2" height="1" fill="#d9a24a"/>
  <rect x="23" y="9" width="2" height="1" fill="#d9a24a"/>
  <rect x="16" y="10" width="2" height="2" fill="#c07a22"/>
  <rect x="24" y="10" width="2" height="2" fill="#c07a22"/>
  <rect x="16" y="12" width="1" height="4" fill="#a8681c"/>
  <rect x="25" y="12" width="1" height="4" fill="#a8681c"/>
  <rect x="16" y="16" width="2" height="2" fill="#c07a22"/>
  <rect x="24" y="16" width="2" height="2" fill="#c07a22"/>
  <rect x="17" y="18" width="2" height="1" fill="#d9a24a"/>
  <rect x="23" y="18" width="2" height="1" fill="#d9a24a"/>
  <rect x="18" y="19" width="6" height="1" fill="#d9a24a"/>

  <!-- glass fill -->
  <rect x="18" y="10" width="6" height="8" fill="#1a8a7c" opacity="0.55"/>
  <rect x="19" y="11" width="2" height="2" fill="#9cf0e2"/>
  <rect x="21" y="13" width="2" height="1" fill="#67d7c6"/>
  <rect x="19" y="15" width="4" height="2" fill="#0f6b5f" opacity="0.45"/>

  <!-- lens handle -->
  <rect x="24" y="19" width="2" height="2" fill="#8a5a18"/>
  <rect x="25" y="21" width="2" height="2" fill="#6f4814"/>
  <rect x="26" y="23" width="2" height="2" fill="#c07a22"/>

  <!-- score spark / trust pip -->
  <rect x="21" y="6" width="1" height="1" fill="#ffe08a"/>
  <rect x="22" y="5" width="1" height="1" fill="#ffe08a"/>
  <rect x="23" y="6" width="1" height="1" fill="#c07a22"/>

  <!-- report fold (tiny page) -->
  <rect x="27" y="11" width="3" height="4" fill="#f4efe4"/>
  <rect x="27" y="11" width="3" height="1" fill="#c9b89a"/>
  <rect x="28" y="13" width="1" height="1" fill="#0f6b5f"/>
  <rect x="28" y="14" width="1" height="1" fill="#c07a22"/>

  <!-- pipeline pips: input parse score report -->
  <rect x="5" y="27" width="2" height="2" fill="#2a9a8d"/>
  <rect x="8" y="27" width="1" height="1" fill="#3bbfad"/>
  <rect x="10" y="27" width="2" height="2" fill="#1f6f66"/>
  <rect x="13" y="27" width="1" height="1" fill="#3bbfad"/>
  <rect x="15" y="27" width="2" height="2" fill="#c07a22"/>
  <rect x="18" y="27" width="1" height="1" fill="#d9a24a"/>
  <rect x="20" y="27" width="2" height="2" fill="#f4efe4"/>
  <rect x="23" y="27" width="1" height="1" fill="#c9b89a"/>
  <rect x="25" y="27" width="2" height="2" fill="#9cf0e2"/>
</svg>
