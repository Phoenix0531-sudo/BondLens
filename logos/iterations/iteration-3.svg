<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BondLens iteration-3 — dark badge variant">
  <!-- Inverted for GitHub avatar / PWA: dark base, light prism frame, amber peak pops -->
  <g id="icon">
    <rect width="512" height="512" rx="96" fill="#17211d"/>
    <!-- hex prism outline, light -->
    <path d="M256 56 L424 152 L424 360 L256 456 L88 360 L88 152 Z"
          fill="none" stroke="#fffdf8" stroke-width="22" stroke-linejoin="round"/>
    <!-- inner facet subtle -->
    <path d="M256 118 L376 186 L376 326 L256 394 L136 326 L136 186 Z"
          fill="#0f6b5f" opacity="0.22"/>
    <!-- yield curve, teal -->
    <path d="M150 330 C190 312, 214 262, 250 232 S314 186, 362 204"
          fill="none" stroke="#0f6b5f" stroke-width="20" stroke-linecap="round"/>
    <!-- amber peak claim -->
    <circle cx="278" cy="206" r="30" fill="#c07a22"/>
    <circle cx="278" cy="206" r="11" fill="#fffdf8"/>
    <!-- baseline -->
    <line x1="150" y1="352" x2="362" y2="352" stroke="#0f6b5f" stroke-width="11" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
