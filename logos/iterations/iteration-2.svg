<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BondLens iteration-2 — composition balance">
  <!-- Rebalanced: hex wider/shorter, curve centered, peak on visual sweet spot, navy spine -->
  <g id="icon">
    <rect width="512" height="512" fill="#fffdf8"/>
    <!-- hex solid fill for stronger silhouette -->
    <path d="M256 56 L430 150 L430 362 L256 456 L82 362 L82 150 Z"
          fill="#0f6b5f" stroke="#0f6b5f" stroke-width="6" stroke-linejoin="round"/>
    <!-- nested inner facet -->
    <path d="M256 118 L376 186 L376 326 L256 394 L136 326 L136 186 Z"
          fill="#fffdf8"/>
    <!-- navy baseline spine through center (adds vertical anchor) -->
    <line x1="256" y1="118" x2="256" y2="394" stroke="#17211d" stroke-width="5" opacity="0.18"/>
    <!-- symmetric yield curve centered on hex -->
    <path d="M150 330 C200 310, 224 250, 256 224 C288 198, 312 210, 362 230"
          fill="none" stroke="#0f6b5f" stroke-width="20" stroke-linecap="round"/>
    <!-- amber peak at apex of the dip -->
    <circle cx="256" cy="212" r="30" fill="#c07a22"/>
    <circle cx="256" cy="212" r="11" fill="#fffdf8"/>
    <!-- baseline ticks -->
    <line x1="150" y1="356" x2="362" y2="356" stroke="#0f6b5f" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
