<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BondLens concept 1 — aperture over yield bars">
  <!-- Geometric aperture framing bond yield bars; amber marks the focused claim -->
  <g id="icon">
    <circle cx="256" cy="256" r="220" fill="#fffdf8"/>
    <circle cx="256" cy="256" r="200" fill="none" stroke="#0f6b5f" stroke-width="28"/>
    <!-- yield bars inside aperture -->
    <rect x="148" y="268" width="36" height="96" rx="6" fill="#0f6b5f" opacity="0.55"/>
    <rect x="200" y="220" width="36" height="144" rx="6" fill="#0f6b5f" opacity="0.75"/>
    <rect x="252" y="176" width="36" height="188" rx="6" fill="#0f6b5f"/>
    <rect x="304" y="204" width="36" height="160" rx="6" fill="#c07a22"/>
    <!-- focus ring on amber bar (evidence target) -->
    <circle cx="322" cy="204" r="22" fill="none" stroke="#c07a22" stroke-width="8"/>
    <circle cx="322" cy="204" r="8" fill="#c07a22"/>
  </g>
</svg>
