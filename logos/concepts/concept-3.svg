<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BondLens concept 3 — evidence chain focus">
  <!-- Trust/evidence chain links converging into a lens node -->
  <g id="icon">
    <circle cx="256" cy="256" r="220" fill="#17211d"/>
    <!-- chain of evidence nodes -->
    <circle cx="118" cy="256" r="28" fill="none" stroke="#0f6b5f" stroke-width="16"/>
    <circle cx="200" cy="256" r="28" fill="none" stroke="#0f6b5f" stroke-width="16"/>
    <line x1="146" y1="256" x2="172" y2="256" stroke="#0f6b5f" stroke-width="16" stroke-linecap="round"/>
    <!-- center lens / claim node -->
    <circle cx="300" cy="256" r="72" fill="none" stroke="#fffdf8" stroke-width="18"/>
    <circle cx="300" cy="256" r="40" fill="#0f6b5f"/>
    <circle cx="300" cy="256" r="16" fill="#c07a22"/>
    <!-- connector into lens -->
    <line x1="228" y1="256" x2="228" y2="256" stroke="#0f6b5f" stroke-width="16"/>
    <line x1="228" y1="256" x2="256" y2="256" stroke="#0f6b5f" stroke-width="16" stroke-linecap="round"/>
    <!-- trailing verified node -->
    <circle cx="400" cy="256" r="22" fill="#c07a22"/>
    <path d="M390 256 l8 8 16-18" fill="none" stroke="#fffdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
