<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BondLens concept 4 — yield curve through prism lens">
  <!-- Hex lens (prism of scrutiny) with a single yield path and amber peak claim -->
  <g id="icon">
    <rect width="512" height="512" fill="#fffdf8"/>
    <!-- hexagonal lens body -->
    <path d="M256 56 L424 152 L424 360 L256 456 L88 360 L88 152 Z"
          fill="none" stroke="#0f6b5f" stroke-width="28" stroke-linejoin="round"/>
    <!-- inner facet -->
    <path d="M256 112 L380 184 L380 328 L256 400 L132 328 L132 184 Z"
          fill="#0f6b5f" opacity="0.08"/>
    <!-- yield curve path -->
    <path d="M150 320 C190 300, 210 250, 246 220 S310 170, 362 188"
          fill="none" stroke="#0f6b5f" stroke-width="18" stroke-linecap="round"/>
    <!-- amber claim peak -->
    <circle cx="278" cy="198" r="22" fill="#c07a22"/>
    <circle cx="278" cy="198" r="8" fill="#fffdf8"/>
    <!-- baseline tick marks (data ticks) -->
    <line x1="150" y1="348" x2="362" y2="348" stroke="#0f6b5f" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
    <line x1="150" y1="336" x2="150" y2="360" stroke="#0f6b5f" stroke-width="8" stroke-linecap="round"/>
    <line x1="256" y1="336" x2="256" y2="360" stroke="#0f6b5f" stroke-width="8" stroke-linecap="round"/>
    <line x1="362" y1="336" x2="362" y2="360" stroke="#0f6b5f" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
