<!DOCTYPE html>
<html lang="{{ 'en' if current_lang == 'en' else 'zh-CN' }}" data-initial-lang="{{ current_lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>
    <style>
        :root {
            --ink: #17211d;
            --muted: #62706b;
            --line: #d8ded9;
            --paper: #f5f3ee;
            --surface: #fffdf8;
            --surface-strong: #ebe6da;
            --teal: #0f6b5f;
            --teal-dark: #084c45;
            --amber: #c07a22;
            --red: #a9423a;
            --green: #2f7d55;
            --shadow: 0 18px 45px rgba(23, 33, 29, 0.09);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background: var(--paper);
            font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        a {
            color: inherit;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid rgba(216, 222, 217, 0.9);
            background: rgba(255, 253, 248, 0.92);
            backdrop-filter: blur(12px);
        }

        .topbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: min(1440px, calc(100% - 40px));
            margin: 0 auto;
            padding: 14px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-weight: 750;
            letter-spacing: 0;
        }

        .brand-mark {
            display: grid;
            width: 32px;
            height: 32px;
            place-items: center;
            border: 1px solid var(--ink);
            background: var(--ink);
            color: var(--surface);
            font-size: 13px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .topnav {
            display: flex;
            align-items: center;
            gap: 18px;
            color: var(--muted);
            font-size: 14px;
        }

        .topnav a {
            text-decoration: none;
        }

        .language-switch {
            display: inline-grid;
            grid-template-columns: 1fr 1fr;
            border: 1px solid var(--line);
            background: rgba(255, 253, 248, 0.82);
        }

        .language-option {
            min-width: 44px;
            border: 0;
            border-right: 1px solid var(--line);
            padding: 7px 10px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font: inherit;
            font-size: 12px;
        }

        .language-option:last-child {
            border-right: 0;
        }

        .language-option[aria-pressed="true"] {
            background: var(--ink);
            color: var(--surface);
        }

        .language-switch.compact .language-option {
            min-width: 40px;
            padding: 6px 8px;
        }

        .page-shell {
            width: min(1440px, calc(100% - 40px));
            margin: 0 auto;
            padding: 28px 0 56px;
        }

        @media (max-width: 760px) {
            .topbar-inner,
            .page-shell {
                width: min(100% - 24px, 1440px);
            }

            .topnav {
                display: none;
            }
        }
    

        .async-stream-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .cancel-button,
        .ghost-button {
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            padding: 6px 12px;
            font: inherit;
            font-size: 12px;
            cursor: pointer;
        }
        .cancel-button:hover,
        .ghost-button:hover {
            border-color: var(--teal);
            color: var(--teal-dark);
        }
        .cancel-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .async-stream-preview {
            margin-top: 10px;
            max-height: 220px;
            overflow: auto;
            padding: 10px 12px;
            border: 1px solid var(--line);
            background: rgba(255, 253, 248, 0.92);
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.45;
            color: var(--ink);
        }
</style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/">
                <span class="brand-mark">BL</span>
                <span>BondLens</span>
            </a>
            <div class="topbar-actions">
            <nav class="topnav" aria-label="Primary">
                <a href="/agent" data-lang-zh="智能体" data-lang-en="Agent">智能体</a>
                <a href="/replay" data-lang-zh="回放" data-lang-en="Replay">回放</a>
                <a href="https://github.com/Phoenix0531-sudo/BondLens">GitHub</a>
                <a href="https://github.com/Phoenix0531-sudo/BondLens/actions/workflows/ci.yml">CI</a>
            </nav>
            <div class="language-switch" aria-label="Language switch">
                <button class="language-option" type="button" data-language-option="zh" aria-pressed="{{ 'true' if current_lang == 'zh' else 'false' }}">中</button>
                <button class="language-option" type="button" data-language-option="en" aria-pressed="{{ 'true' if current_lang == 'en' else 'false' }}">EN</button>
            </div>
            </div>
        </div>
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
    <script>
        (() => {
            const storageKey = "bondlens.language";
            const normalize = (value) => (value === "en" ? "en" : "zh");

            function setUrlLanguage(lang) {
                const url = new URL(window.location.href);
                url.searchParams.set("lang", lang);
                window.history.replaceState({}, "", url);
            }

            function applyLanguage(lang, persist = true) {
                const activeLang = normalize(lang);
                document.documentElement.lang = activeLang === "en" ? "en" : "zh-CN";
                document.documentElement.dataset.initialLang = activeLang;

                document.querySelectorAll("[data-lang-zh][data-lang-en]").forEach((element) => {
                    element.textContent = activeLang === "en" ? element.dataset.langEn : element.dataset.langZh;
                });

                document.querySelectorAll("[data-placeholder-zh][data-placeholder-en]").forEach((element) => {
                    element.setAttribute(
                        "placeholder",
                        activeLang === "en" ? element.dataset.placeholderEn : element.dataset.placeholderZh
                    );
                });

                document.querySelectorAll("[data-lang-zh-aria][data-lang-en-aria]").forEach((element) => {
                    element.setAttribute(
                        "aria-label",
                        activeLang === "en" ? element.dataset.langEnAria : element.dataset.langZhAria
                    );
                });

                document.querySelectorAll("input[name='lang']").forEach((element) => {
                    element.value = activeLang;
                });

                const answerTargets = document.querySelectorAll("[data-answer-target], [data-answer-target-secondary]");
                const answerTranslations = document.getElementById("answer-translations");
                if (answerTargets.length && answerTranslations) {
                    try {
                        const payload = JSON.parse(answerTranslations.textContent || "{}");
                        const text = payload[activeLang] || payload.zh || "";
                        answerTargets.forEach((target) => {
                            target.textContent = text;
                        });
                    } catch {
                        /* keep current text */
                    }
                }

                const summaryList = document.querySelector("[data-summary-sentences]");
                const summaryTranslations = document.getElementById("summary-translations");
                if (summaryList && summaryTranslations) {
                    try {
                        const payload = JSON.parse(summaryTranslations.textContent || "{}");
                        const sentences = (payload[activeLang] || payload.zh || {}).sentences || [];
                        const items = summaryList.querySelectorAll("li");
                        sentences.forEach((sentence, index) => {
                            if (items[index]) {
                                items[index].textContent = sentence;
                            }
                        });
                    } catch {
                        /* keep current text */
                    }
                }

                const traceList = document.querySelector("[data-trace-list]");
                const traceTranslations = document.getElementById("trace-translations");
                if (traceList && traceTranslations) {
                    try {
                        const payload = JSON.parse(traceTranslations.textContent || "{}");
                        traceList.querySelectorAll("li").forEach((item, index) => {
                            const text = (payload[activeLang] || [])[index] || "";
                            if (!text) {
                                return;
                            }
                            const label = item.querySelector("span:last-child");
                            if (label) {
                                label.textContent = text;
                            } else {
                                item.textContent = text;
                            }
                        });
                    } catch {
                        /* keep current text */
                    }
                }

                const lineageTranslations = document.getElementById("data-lineage-translations");
                if (lineageTranslations) {
                    try {
                        const payload = JSON.parse(lineageTranslations.textContent || "{}");
                        const active = payload[activeLang] || payload.zh || {};
                        const title = document.querySelector("[data-lineage-title]");
                        const subtitle = document.querySelector("[data-lineage-freshness]");
                        const runtime = document.querySelector("[data-lineage-runtime]");
                        const fetched = document.querySelector("[data-lineage-fetched]");
                        if (title && active.title) title.textContent = active.title;
                        if (subtitle && active.freshness) subtitle.textContent = active.freshness;
                        if (runtime && active.runtime_label) runtime.textContent = active.runtime_label;
                        if (fetched && active.fetched_at_label) {
                            fetched.textContent = activeLang === "en"
                                ? `Fetched ${active.fetched_at_label}`
                                : `获取 ${active.fetched_at_label}`;
                        }
                        document.querySelectorAll("[data-lineage-lines] li").forEach((item, index) => {
                            const line = (active.lines || [])[index];
                            if (line) item.textContent = line;
                        });
                    } catch {
                        /* keep current text */
                    }
                }

                const maturityTranslations = document.getElementById("maturity-board-translations");
                if (maturityTranslations) {
                    try {
                        const payload = JSON.parse(maturityTranslations.textContent || "{}");
                        const active = payload[activeLang] || payload.zh || {};
                        const title = document.querySelector("[data-maturity-board-title]");
                        const subtitle = document.querySelector("[data-maturity-board-subtitle]");
                        const note = document.querySelector("[data-maturity-board-note]");
                        if (title && active.title) title.textContent = active.title;
                        if (subtitle && active.subtitle) subtitle.textContent = active.subtitle;
                        if (note && active.note) note.textContent = active.note;
                    } catch {
                        /* keep current text */
                    }
                }

                document.querySelectorAll("[data-language-option]").forEach((button) => {
                    button.setAttribute("aria-pressed", button.dataset.languageOption === activeLang ? "true" : "false");
                });

                document.querySelectorAll("[data-fill-question-zh],[data-fill-question-en],[data-fill-question]").forEach((chip) => {
                    const zh = chip.dataset.fillQuestionZh || chip.dataset.fillQuestion || chip.dataset.langZh || "";
                    const en = chip.dataset.fillQuestionEn || chip.dataset.fillQuestion || chip.dataset.langEn || zh;
                    chip.dataset.fillQuestion = activeLang === "en" ? en : zh;
                });

                if (persist) {
                    window.localStorage.setItem(storageKey, activeLang);
                    setUrlLanguage(activeLang);
                    // Mirror into cookie so server-rendered pages keep language after refresh.
                    document.cookie = `bondlens_lang=${activeLang}; path=/; max-age=${60 * 60 * 24 * 365}; samesite=lax`;
                }
            }

            // Soft-render / console scripts call this after async results.
            window.applyLanguage = applyLanguage;

            document.querySelectorAll("[data-language-option]").forEach((button) => {
                button.addEventListener("click", () => applyLanguage(button.dataset.languageOption));
            });

            document.querySelectorAll("[data-fill-question-zh],[data-fill-question-en],[data-fill-question]").forEach((chip) => {
                chip.addEventListener("click", () => {
                    const question = document.getElementById("question");
                    if (question) {
                        const activeLang = normalize(document.documentElement.dataset.initialLang);
                        const zh = chip.dataset.fillQuestionZh || chip.dataset.fillQuestion || chip.dataset.langZh || "";
                        const en = chip.dataset.fillQuestionEn || chip.dataset.fillQuestion || chip.dataset.langEn || zh;
                        question.value = activeLang === "en" ? en : zh;
                        question.focus();
                    }
                });
            });

            function readCookie(name) {
                const prefix = `${name}=`;
                return document.cookie
                    .split(";")
                    .map((part) => part.trim())
                    .find((part) => part.startsWith(prefix))
                    ?.slice(prefix.length);
            }

            const urlLang = new URL(window.location.href).searchParams.get("lang");
            const cookieLang = readCookie("bondlens_lang");
            const initialLang = normalize(
                urlLang || cookieLang || window.localStorage.getItem(storageKey) || document.documentElement.dataset.initialLang
            );
            applyLanguage(initialLang, Boolean(urlLang) || Boolean(cookieLang));
        })();
    </script>
</body>
</html>
